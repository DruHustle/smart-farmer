name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smart_farmer
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: smart_farmer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart_farmer -d smart_farmer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://smart_farmer:test-only@localhost:5432/smart_farmer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix smart-farmer-backend
      - run: npm ci --prefix smart-farmer-frontend/web
      - run: npm run build
      - run: npm test
