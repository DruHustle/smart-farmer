name: iOS device archive
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-device-archive.yml'
      - 'scripts/ios-device-distribution.sh'
permissions:
  contents: read
concurrency:
  group: 'farmer-device-archive-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://farmer.onesa.eu
    defaults:
      run:
        working-directory: smart-farmer-frontend/mobile
    steps:
      - name: Check hosted validation allowance
        env:
          PRIVATE_REPO: ${{ github.event.repository.private }}
          PRIVATE_ALLOWANCE: ${{ vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PRIVATE_REPO" = false || test "$PRIVATE_ALLOWANCE" = true
        working-directory: .
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
      - run: npm ci --no-audit --no-fund
      - name: Prepare native pods
        run: |
          npx --no-install expo prebuild --no-install --platform ios
          pod install --project-directory=ios
      - name: Archive a generic ARM64 iPhoneOS device build and inspect the embedded product
        run: |
          archive="$RUNNER_TEMP/SmartFarmer-device.xcarchive"
          trap 'rm -rf "$archive"' EXIT
          bash "$GITHUB_WORKSPACE/scripts/ios-device-distribution.sh" check "$archive"
          review="$RUNNER_TEMP/ios-archive-review"
          mkdir "$review"
          ditto -c -k --sequesterRsrc --keepParent "$archive" "$review/SmartFarmer-unsigned.xcarchive.zip"
          cd "$review"
          shasum -a 256 SmartFarmer-unsigned.xcarchive.zip > SHA256SUMS
          jq -n --arg commit "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --arg tree "$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')" \
            --argjson app "$(jq '.expo | {id:.ios.bundleIdentifier,version,build:.ios.buildNumber}' "$GITHUB_WORKSPACE/smart-farmer-frontend/mobile/app.json")" \
            '{commit:$commit,tree:$tree,app:$app,signing:"unsigned",purpose:"Device archive inspection. Owner distribution signing and store validation are required."}' > manifest.json
      - name: Retain inspected unsigned device archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-unsigned-validation-archive
          path: ${{ runner.temp }}/ios-archive-review
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
