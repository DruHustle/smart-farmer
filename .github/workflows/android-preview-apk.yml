name: Android preview APK
on:
  pull_request:
    paths:
      - '.github/workflows/android-preview-apk.yml'
      - 'smart-farmer-frontend/mobile/scripts/android-delivery.py'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the owner-signed 64-bit preview to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-preview-apk-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  APP_ID: eu.onesa.smartfarmer
  APK_NAME: SmartFarmerPreview-64bit.apk
  MOBILE: smart-farmer-frontend/mobile
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check hosted validation allowance
        env:
          PRIVATE_REPO: ${{ github.event.repository.private }}
          PRIVATE_ALLOWANCE: ${{ vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PRIVATE_REPO" = false || test "$PRIVATE_ALLOWANCE" = true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
      - name: Install locked dependencies and Android build tools
        run: |
          cd "$MOBILE"
          npm ci --no-audit --no-fund
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -e "$ANDROID_HOME/platforms/android-37" || ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
      - name: Build a standalone 64-bit release APK
        env:
          EXPO_PUBLIC_API_URL: https://farmer.onesa.eu
          NODE_ENV: production
        run: |
          cd "$MOBILE"
          ./android/gradlew -p android :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --console=plain
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Exercise binary signing, package identity and signer rejection using a disposable certificate
        env:
          ANDROID_RELEASE_ALIAS: qualification
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          export ANDROID_RELEASE_KEYSTORE="$work/test.p12"
          export ANDROID_RELEASE_STORE_PASSWORD="$(openssl rand -hex 24)"
          export ANDROID_RELEASE_KEY_PASSWORD="$ANDROID_RELEASE_STORE_PASSWORD"
          keytool -genkeypair -storetype PKCS12 -keystore "$ANDROID_RELEASE_KEYSTORE" -storepass:env ANDROID_RELEASE_STORE_PASSWORD -alias qualification -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Disposable package verification' >/dev/null 2>&1
          keytool -exportcert -alias qualification -keystore "$ANDROID_RELEASE_KEYSTORE" -storepass:env ANDROID_RELEASE_STORE_PASSWORD -file "$work/cert.der"
          cert=$(sha256sum "$work/cert.der" | cut -d' ' -f1)
          tool="$MOBILE/scripts/android-delivery.py"
          buildtools="$ANDROID_HOME/build-tools/37.0.0"
          unsigned="$MOBILE/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          python3 "$tool" sign --apk "$unsigned" --output "$work/test.apk" --package "$APP_ID" --certificate "$cert" --tools "$buildtools"
          python3 "$tool" verify --apk "$work/test.apk" --package "$APP_ID" --certificate "$cert" --tools "$buildtools"
          if python3 "$tool" verify --apk "$work/test.apk" --package "$APP_ID" --certificate "$(printf '%064d' 0)" --tools "$buildtools"; then
            echo 'Unexpectedly accepted a different signing identity' >&2
            exit 1
          fi
          cp "$work/test.apk" "$RUNNER_TEMP/disposable-qualification.apk"
      - name: Enable KVM for the stock Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and cold-launch the signed release variant without Metro
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/disposable-qualification.apk"
            adb shell am start -W -n "$APP_ID/.MainActivity" | tee "$RUNNER_TEMP/launch.txt"
            grep -F 'Status: ok' "$RUNNER_TEMP/launch.txt"
            sleep 8
            adb shell pidof "$APP_ID"
      - name: Remove the disposable signed package
        if: always()
        run: rm -f "$RUNNER_TEMP/disposable-qualification.apk"
      - name: Transfer unsigned input to the owner-signing job
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-release-input
          path: smart-farmer-frontend/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: android-distribution
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Android signature verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0"'
      - name: Retrieve this run's unsigned input
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n unsigned-release-input -D "$RUNNER_TEMP/input"
      - name: Sign and verify with the owner's distribution identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_ALIAS: ${{ vars.ANDROID_RELEASE_ALIAS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          CERTIFICATE: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?Configure the product signing keystore}"
          export ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/owner-signing-key"
          trap 'rm -f "$ANDROID_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          python3 "$MOBILE/scripts/android-delivery.py" sign --apk "$RUNNER_TEMP/input/app-release-unsigned.apk" --output "$RUNNER_TEMP/$APK_NAME" --package "$APP_ID" --certificate "$CERTIFICATE" --tools "$ANDROID_HOME/build-tools/37.0.0" > "$RUNNER_TEMP/apk-receipt.json"
      - name: Publish the verified package and confirm the public download
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          version=$(jq -r .versionCode apk-receipt.json)
          tag="android-preview-v$version"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$APK_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$APK_NAME" apk-receipt.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Android preview · build $version" --notes "ARM64 Android preview. The receipt lists the package identity and SHA-256."
          fi
          curl --fail --location --retry 3 "$url" -o downloaded.apk
          cmp "$APK_NAME" downloaded.apk
          python3 "$GITHUB_WORKSPACE/$MOBILE/scripts/android-delivery.py" verify --apk downloaded.apk --package "$APP_ID" --certificate "$CERTIFICATE" --tools "$ANDROID_HOME/build-tools/37.0.0"
          echo "Verified public Android preview: $url" >> "$GITHUB_STEP_SUMMARY"
