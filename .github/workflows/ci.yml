name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-farmer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smart_farmer
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: smart_farmer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart_farmer -d smart_farmer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://smart_farmer:test-only@localhost:5432/smart_farmer_test
      DATABASE_URL: postgresql://smart_farmer:test-only@localhost:5432/smart_farmer_test
      LOG_LEVEL: silent
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix smart-farmer-backend
      - run: npm ci --prefix smart-farmer-frontend/web
      - run: npm ci --prefix smart-farmer-backend/edge
      - name: API and concurrency workflows against PostgreSQL
        run: npm test --prefix smart-farmer-backend
      - name: Offline storage, language and farm-time rules
        run: npm test --prefix smart-farmer-frontend/web
      - name: Edge replay and interlock tests
        run: npm test --prefix smart-farmer-backend/edge
      - name: Python edge HMAC, replay and durable spool tests
        run: python3 -m unittest discover -s smart-farmer-backend/edge -p 'test_*.py' -v
      - name: Validate isolated production candidate configuration
        run: |
          set -euo pipefail
          export FARMER_RUNTIME_ENV_FILE="$RUNNER_TEMP/farm-runtime.env"
          printf 'PGHOST=db\nPGUSER=farm\nPGPASSWORD=ci-only\nPGDATABASE=farm\n' > "$FARMER_RUNTIME_ENV_FILE"
          chmod 600 "$FARMER_RUNTIME_ENV_FILE"
          export FARMER_API_IMAGE="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          export FARMER_WEB_IMAGE="sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          export FARMER_DB_IMAGE="sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
          export FARMER_SOURCE_REVISION="cccccccccccccccccccccccccccccccccccccccc"
          export FARMER_WEB_ORIGIN="https://farmer.onesa.eu" FARMER_API_PORT=18131 FARMER_WEB_PORT=18132
          export FARMER_POSTGRES_USER=farm FARMER_POSTGRES_PASSWORD=ci-only FARMER_POSTGRES_DB=farm
          node smart-farmer-backend/deploy/onesa/validate.mjs
          docker compose -f smart-farmer-backend/deploy/onesa/compose.yml --profile local-db --profile ops config --quiet
      - name: Validate Node-RED demonstration flow format
        run: python3 -m json.tool smart-farmer-backend/edge/node-red/flows.example.json > /dev/null
      - name: Install browser
        working-directory: smart-farmer-frontend/web
        run: npx playwright install --with-deps chromium
      - name: Build both applications and exercise browser journeys
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/smart-farmer-browser
        run: npm run test:e2e --prefix smart-farmer-frontend/web
      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: ${{ runner.temp }}/smart-farmer-browser
          if-no-files-found: ignore
          retention-days: 7

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: smart-farmer-frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Native business rules and durable repository
        run: npm test
      - name: Typecheck and export iOS and Android JavaScript bundles
        run: npm run build

  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smart_farmer
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: smart_farmer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart_farmer -d smart_farmer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://smart_farmer:test-only@localhost:5432/smart_farmer_test
      DATABASE_URL: postgresql://smart_farmer:test-only@localhost:5432/smart_farmer_test
      LOG_LEVEL: silent
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix smart-farmer-backend
      - run: npm run build --prefix smart-farmer-backend
      - name: Validate local container configuration and build runtime image
        run: |
          POSTGRES_PASSWORD=test-only docker compose -f smart-farmer-backend/compose.yml config --quiet
          docker build --tag smart-farmer-api:ci smart-farmer-backend
          docker run --rm --entrypoint node smart-farmer-api:ci -e 'import("sharp").then(async ({default: sharp}) => { const image = await sharp({create:{width:1,height:1,channels:3,background:"red"}}).png().toBuffer(); if (!image.length) process.exit(1); })'
          docker build --tag smart-farmer-db:ci --file smart-farmer-backend/Dockerfile.database smart-farmer-backend
          candidate_db=$(docker run --detach --tmpfs /var/lib/postgresql/data:rw -e POSTGRES_PASSWORD=ci-only smart-farmer-db:ci)
          trap 'docker rm -f "$candidate_db" >/dev/null' EXIT
          for attempt in $(seq 1 60); do docker exec "$candidate_db" pg_isready -U postgres && break; sleep 1; done
          docker exec "$candidate_db" psql -U postgres -c 'SELECT 1'
          docker build --tag smart-farmer-backup:ci --file smart-farmer-backend/Dockerfile.backup smart-farmer-backend
          mkdir -p "$RUNNER_TEMP/private-media-test"
          chmod 777 "$RUNNER_TEMP/private-media-test"
          docker run --rm --mount "type=bind,src=$RUNNER_TEMP/private-media-test,dst=/scratch" --entrypoint node smart-farmer-api:ci -e 'const fs=require("node:fs");fs.mkdirSync("/scratch/farm",{mode:0o700});fs.writeFileSync("/scratch/farm/object","synthetic",{mode:0o600})'
          docker run --rm --mount "type=bind,src=$RUNNER_TEMP/private-media-test,dst=/scratch,readonly" --entrypoint node smart-farmer-backup:ci -e 'if(require("node:fs").readFileSync("/scratch/farm/object","utf8")!=="synthetic")process.exit(1)'
          docker run --rm --entrypoint node smart-farmer-backup:ci --version
          docker run --rm --entrypoint pg_dump smart-farmer-backup:ci --version
          docker run --rm --entrypoint pg_restore smart-farmer-backup:ci --version
          docker run --rm --entrypoint python3 smart-farmer-backup:ci --version
      - name: Use matching PostgreSQL 17 backup clients
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          cat > "$RUNNER_TEMP/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE "$POSTGRES_CONTAINER_ID" pg_dump "$@"
          SH
          cat > "$RUNNER_TEMP/pg_restore" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE "$POSTGRES_CONTAINER_ID" pg_restore "$@"
          SH
          chmod 700 "$RUNNER_TEMP/pg_dump" "$RUNNER_TEMP/pg_restore"
          printf 'PG_DUMP_BIN=%s/pg_dump\nPG_RESTORE_BIN=%s/pg_restore\nPOSTGRES_CONTAINER_ID=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$POSTGRES_CONTAINER_ID" >> "$GITHUB_ENV"
      - name: Restore encrypted database and attachments into isolated target
        run: npm run test:backup --prefix smart-farmer-backend

  web-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Build and verify the read-only static web and PWA image
        run: node smart-farmer-frontend/web/scripts/test-container.mjs
