name: Native acceptance
on:
  workflow_dispatch:
  push:
    paths: ['smart-farmer-frontend/mobile/**', 'smart-farmer-backend/**', '.github/workflows/native-acceptance.yml']
  pull_request:
    paths: ['smart-farmer-frontend/mobile/**', 'smart-farmer-backend/**', '.github/workflows/native-acceptance.yml']
permissions:
  contents: read
concurrency:
  group: native-acceptance-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_URL: http://127.0.0.1:3001
  WEB_ORIGIN: http://127.0.0.1:3001
  LOG_LEVEL: silent
  NODE_ENV: test
  NATIVE_FIXTURE_PATH: /tmp/smart-farmer-native-fixture.json
  NATIVE_OFFLINE_FLAG: /tmp/smart-farmer-native-offline
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://smart_farmer:test-only@127.0.0.1:5432/smart_farmer_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smart_farmer
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: smart_farmer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart_farmer -d smart_farmer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm ci --prefix smart-farmer-frontend/mobile
      - run: npm ci --prefix smart-farmer-backend
      - name: Compile native SQLCipher Android debug application
        working-directory: smart-farmer-frontend/mobile
        run: |
          npx expo prebuild --no-install --platform android
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2
      - name: Start isolated API and Metro
        run: bash smart-farmer-frontend/mobile/acceptance/start-services.sh
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android restart, offline, encryption and permission journeys
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash smart-farmer-frontend/mobile/acceptance/android.sh
      - name: Retain debug APK and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-acceptance
          retention-days: 7
          path: |
            smart-farmer-frontend/mobile/android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/native-evidence
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DATABASE_URL: postgresql://native_ci@127.0.0.1:5432/smart_farmer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Start isolated PostgreSQL
        run: |
          brew install postgresql@17
          NATIVE_PG_BIN="$(brew --prefix postgresql@17)/bin"
          "$NATIVE_PG_BIN/initdb" -D "$RUNNER_TEMP/native-pg" -U native_ci -A trust
          "$NATIVE_PG_BIN/pg_ctl" -D "$RUNNER_TEMP/native-pg" -l "$RUNNER_TEMP/native-pg.log" -o "-p 5432 -h 127.0.0.1 -k $RUNNER_TEMP" start
          "$NATIVE_PG_BIN/createdb" -h 127.0.0.1 -U native_ci smart_farmer_test
      - run: npm ci --prefix smart-farmer-frontend/mobile
      - run: npm ci --prefix smart-farmer-backend
      - name: Compile native SQLCipher iOS simulator application
        working-directory: smart-farmer-frontend/mobile
        run: |
          npx expo prebuild --no-install --platform ios
          cd ios
          pod install
          xcodebuild -workspace SmartFarmer.xcworkspace -scheme SmartFarmer -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/native-ios" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/native-ios/Build/Products/Debug-iphonesimulator/SmartFarmer.app" "$RUNNER_TEMP/SmartFarmer-simulator.zip"
      - name: Start isolated API and Metro
        run: bash smart-farmer-frontend/mobile/acceptance/start-services.sh
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Native iPhone and iPad journeys
        run: bash smart-farmer-frontend/mobile/acceptance/ios.sh
      - name: Retain simulator app and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-acceptance
          retention-days: 7
          path: |
            ${{ runner.temp }}/SmartFarmer-simulator.zip
            ${{ runner.temp }}/native-evidence
