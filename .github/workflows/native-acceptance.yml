name: Native acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['smart-farmer-frontend/mobile/**', 'smart-farmer-backend/**', '.github/workflows/native-acceptance.yml', '!smart-farmer-backend/docs/**', '!smart-farmer-backend/*.md', '!smart-farmer-backend/edge/*.md', '!smart-farmer-frontend/mobile/*.md']
  pull_request:
    paths: ['smart-farmer-frontend/mobile/**', 'smart-farmer-backend/**', '.github/workflows/native-acceptance.yml', '!smart-farmer-backend/docs/**', '!smart-farmer-backend/*.md', '!smart-farmer-backend/edge/*.md', '!smart-farmer-frontend/mobile/*.md']
permissions:
  contents: read
env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  # Fixed-category local-session diagnostics are enabled only in acceptance binaries/Metro.
  EXPO_PUBLIC_NATIVE_SESSION_TRACE: '1'
  EXPO_PUBLIC_API_URL: http://127.0.0.1:3001
  WEB_ORIGIN: http://127.0.0.1:3001
  LOG_LEVEL: silent
  NODE_ENV: test
  NATIVE_FIXTURE_PATH: /tmp/smart-farmer-native-fixture.json
  NATIVE_OFFLINE_FLAG: /tmp/smart-farmer-native-offline
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Preserve each platform's compile/cache without blocking the other platform's UI feedback.
    concurrency:
      group: native-android-${{ github.ref }}
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://smart_farmer:test-only@127.0.0.1:5432/smart_farmer_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smart_farmer
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: smart_farmer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart_farmer -d smart_farmer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Reserve disk for Android compilation and emulator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"
          df -h "$RUNNER_TEMP" > "$RUNNER_TEMP/native-evidence/android-disk.txt"
          # These unrelated preinstalled toolchains belong only to this disposable runner.
          # Keep Android SDK/NDK, Java, Node and PostgreSQL intact.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP" >> "$RUNNER_TEMP/native-evidence/android-disk.txt"
      - run: npm ci --prefix smart-farmer-frontend/mobile
      - run: npm ci --prefix smart-farmer-backend
      - name: Install local invoice extraction tools
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng poppler-utils
      - name: Cache Android compiler dependencies for this native configuration
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: native-gradle-${{ runner.os }}-${{ hashFiles('smart-farmer-frontend/mobile/package-lock.json', 'smart-farmer-frontend/mobile/app.json', 'smart-farmer-frontend/mobile/plugins/**', 'smart-farmer-frontend/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Restore matching native Android debug binary
        id: android-binary
        uses: actions/cache/restore@v4
        with:
          path: smart-farmer-frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: native-android-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('smart-farmer-frontend/mobile/package-lock.json', 'smart-farmer-frontend/mobile/app.json', 'smart-farmer-frontend/mobile/plugins/**', 'smart-farmer-frontend/mobile/android/**', 'smart-farmer-frontend/mobile/ios/**') }}
      - name: Compile native SQLCipher Android debug application
        if: steps.android-binary.outputs.cache-hit != 'true'
        working-directory: smart-farmer-frontend/mobile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          npx expo prebuild --no-install --platform android
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2 2>&1 | tee "$RUNNER_TEMP/native-evidence/android-build.log"
      - name: Save successful Android compilation before UI journeys
        if: steps.android-binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: smart-farmer-frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.android-binary.outputs.cache-primary-key }}
      - name: Release compiler intermediates before installing emulator
        run: |
          set -euo pipefail
          rm -rf smart-farmer-frontend/mobile/android/app/.cxx smart-farmer-frontend/mobile/android/app/build/intermediates/cxx smart-farmer-frontend/mobile/node_modules/react-native/ReactAndroid/.cxx
          df -h "$RUNNER_TEMP" >> "$RUNNER_TEMP/native-evidence/android-disk.txt"
      - name: Start isolated API and Metro
        run: bash smart-farmer-frontend/mobile/acceptance/start-services.sh android
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android restart, offline, encryption and permission journeys
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash smart-farmer-frontend/mobile/acceptance/android.sh
      - name: Retain android acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-acceptance
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}
          path: ${{ runner.temp }}/native-evidence
      - name: Retain successful debug APK for review
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: native-android-preview
          retention-days: 3
          path: smart-farmer-frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    # Use the standard ARM simulator runner. The Intel XCTest process exceeded
    # the startup deadline before it served its first request; retain that deadline.
    runs-on: macos-26
    timeout-minutes: 75
    concurrency:
      group: native-ios-${{ github.ref }}
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://native_ci@127.0.0.1:5432/smart_farmer_test
      EXPO_PUBLIC_API_URL: https://127.0.0.1:3001
      WEB_ORIGIN: https://127.0.0.1:3001
      # Bound driver startup separately from the unchanged application assertions.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Start isolated PostgreSQL
        run: |
          brew install postgresql@17
          NATIVE_PG_BIN="$(brew --prefix postgresql@17)/bin"
          "$NATIVE_PG_BIN/initdb" -D "$RUNNER_TEMP/native-pg" -U native_ci -A trust
          "$NATIVE_PG_BIN/pg_ctl" -D "$RUNNER_TEMP/native-pg" -l "$RUNNER_TEMP/native-pg.log" -o "-p 5432 -h 127.0.0.1 -k $RUNNER_TEMP" start
          "$NATIVE_PG_BIN/createdb" -h 127.0.0.1 -U native_ci smart_farmer_test
      - run: npm ci --prefix smart-farmer-frontend/mobile
      - run: npm ci --prefix smart-farmer-backend
      - name: Install local invoice extraction tools
        run: brew install tesseract poppler
      - name: Bind simulator cache to the active Xcode and SDK
        id: ios-toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"
          xcodebuild -version > "$RUNNER_TEMP/native-evidence/ios-build-toolchain.txt"
          xcrun --sdk iphonesimulator --show-sdk-version >> "$RUNNER_TEMP/native-evidence/ios-build-toolchain.txt"
          xcrun --sdk iphonesimulator --show-sdk-build-version >> "$RUNNER_TEMP/native-evidence/ios-build-toolchain.txt"
          fingerprint=$(shasum -a 256 "$RUNNER_TEMP/native-evidence/ios-build-toolchain.txt" | cut -d ' ' -f 1)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore matching native iOS simulator binary
        id: ios-binary
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/SmartFarmer-simulator.zip
          # Release embeds JavaScript: bind the entire checked-out revision as well as Xcode.
          key: native-ios-release-adhoc-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-toolchain.outputs.fingerprint }}-${{ github.sha }}
      - name: Compile native SQLCipher iOS simulator application
        if: steps.ios-binary.outputs.cache-hit != 'true'
        working-directory: smart-farmer-frontend/mobile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"
          npx expo prebuild --no-install --platform ios
          cd ios
          pod install 2>&1 | tee "$RUNNER_TEMP/native-evidence/ios-pods.log"
          if NODE_ENV=production xcodebuild -workspace SmartFarmer.xcworkspace -scheme SmartFarmer -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/native-ios" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES build > "$RUNNER_TEMP/native-evidence/ios-build.log" 2>&1; then
            echo 'Native iOS compilation passed; complete output is retained in the evidence artifact.'
          else
            NATIVE_BUILD_STATUS=$?
            tail -n 120 "$RUNNER_TEMP/native-evidence/ios-build.log"
            exit "$NATIVE_BUILD_STATUS"
          fi
          test -s "$RUNNER_TEMP/native-ios/Build/Products/Release-iphonesimulator/SmartFarmer.app/main.jsbundle"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/native-ios/Build/Products/Release-iphonesimulator/SmartFarmer.app" "$RUNNER_TEMP/SmartFarmer-simulator.zip"
      - name: Save successful iOS compilation before UI journeys
        if: steps.ios-binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/SmartFarmer-simulator.zip
          key: ${{ steps.ios-binary.outputs.cache-primary-key }}
      - name: Restore simulator app and inspect native signing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence" "$RUNNER_TEMP/native-ios/Build/Products/Release-iphonesimulator"
          ditto -x -k "$RUNNER_TEMP/SmartFarmer-simulator.zip" "$RUNNER_TEMP/native-ios/Build/Products/Release-iphonesimulator"
          NATIVE_APP="$RUNNER_TEMP/native-ios/Build/Products/Release-iphonesimulator/SmartFarmer.app"
          test -s "$NATIVE_APP/main.jsbundle"
          codesign -d --entitlements :- "$NATIVE_APP" > "$RUNNER_TEMP/native-evidence/ios-entitlements.plist" 2> "$RUNNER_TEMP/native-evidence/ios-signing.txt"
          codesign --verify --deep --strict "$NATIVE_APP"
          git rev-parse HEAD > "$RUNNER_TEMP/native-evidence/ios-embedded-source.txt"
          shasum -a 256 "$NATIVE_APP/main.jsbundle" >> "$RUNNER_TEMP/native-evidence/ios-embedded-source.txt"
      - name: Start isolated API with trusted simulator TLS
        run: bash smart-farmer-frontend/mobile/acceptance/start-services.sh ios
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Native iPhone and iPad journeys
        # Preserve the current cold XCTest allowance and every application deadline.
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          set -euo pipefail
          bash smart-farmer-frontend/mobile/acceptance/ios.sh 2>&1 | tee "$RUNNER_TEMP/native-evidence/ios-journey.log"
      - name: Retain iOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-acceptance
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}
          path: ${{ runner.temp }}/native-evidence
      - name: Retain successful simulator app for review
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-preview
          retention-days: 3
          path: ${{ runner.temp }}/SmartFarmer-simulator.zip
          if-no-files-found: error
