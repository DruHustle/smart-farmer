appId: eu.onesa.smartfarmer
---
- runFlow: forum-open.yaml
- scrollUntilVisible:
    element:
      id: forum-filter-topic
    centerElement: true
    direction: DOWN
    timeout: 30000
- tapOn:
    id: forum-filter-topic
- tapOn:
    id: forum-filter-topic-option-crops
- scrollUntilVisible:
    element:
      id: forum-search
    # Keep the search field clear of the fixed bottom navigation before tapping.
    centerElement: true
    direction: DOWN
    timeout: 30000
- tapOn:
    id: forum-search
- copyTextFrom:
    id: forum-search
- runFlow:
    when:
      true: ${!['', 'Tsvaga muhurukuro', 'Dinga ezingxoxweni'].includes(maestro.copiedText)}
    commands:
      # A retained search may place the caret in the middle when tapped.
      - runFlow:
          when:
            platform: Android
          commands:
            - longPressOn:
                id: forum-search
            - tapOn: '^Select All$'
            - eraseText: 1
      - runFlow:
          when:
            platform: iOS
          commands:
            # Keep the caret after this short fixture query without depending
            # on the iOS selection menu appearing after a long press.
            - tapOn:
                id: forum-search
                point: '95%,50%'
            - eraseText: 100
- copyTextFrom:
    id: forum-search
# An empty field can expose its accessibility label in either supported language.
# Check that empty state before typing, then assert the exact resulting query.
- assertTrue: ${['', 'Tsvaga muhurukuro', 'Dinga ezingxoxweni'].includes(maestro.copiedText)}
- inputText: Native community discussion
- assertVisible:
    id: forum-search
    text: '(?-i)^Native community discussion$'
- runFlow: dismiss-keyboard.yaml
- assertVisible:
    id: tab-forum
    selected: true
- scrollUntilVisible:
    element:
      id: forum-search-submit
      enabled: true
    centerElement: true
    direction: DOWN
    timeout: 30000
- tapOn:
    id: forum-search-submit
- scrollUntilVisible:
    element:
      id: forum-open-.*
      text: '^Native community discussion$'
    centerElement: true
    direction: DOWN
    timeout: 30000
- tapOn:
    id: forum-open-.*
    text: '^Native community discussion$'
- scrollUntilVisible:
    element:
      id: forum-back
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Synthetic community fixture; no agronomic advice.
    direction: DOWN
    timeout: 30000
- assertVisible: CommunityGrower
- assertVisible: Synthetic community fixture; no agronomic advice.
- takeScreenshot: native-forum-community-discussion
