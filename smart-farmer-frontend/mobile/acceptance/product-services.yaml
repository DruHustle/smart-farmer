appId: eu.onesa.smartfarmer
---
- tapOn:
    id: "tab-more"
- scrollUntilVisible:
    element:
      id: "workspace-language"
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    centerElement: true
    element:
      id: "more-services"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "more-services"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "service-open-${SERVICE_ID}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "service-open-${SERVICE_ID}"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "form-projectId"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "form-projectId"
- scrollUntilVisible:
    element:
      id: "form-projectId-option-${PROJECT_ID}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "form-projectId-option-${PROJECT_ID}"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "form-note"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "form-note"
- inputText: "Native accepted booking request"
- runFlow: dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: "form-note"
    direction: UP
    timeout: 20000
- assertVisible:
    id: "form-note"
    text: '^Native accepted booking request$'
- scrollUntilVisible:
    centerElement: true
    element:
      id: "product-review"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "product-review"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "product-confirm"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "product-confirm"
- extendedWaitUntil:
    notVisible:
      id: "product-confirm"
    timeout: 45000
- tapOn:
    id: "sheet-close"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "service-tabs"
    direction: UP
    timeout: 30000
- tapOn:
    id: "service-tabs"
- tapOn:
    id: "service-tabs-option-bookings"
- scrollUntilVisible:
    element:
      text: "Native acceptance tractor"
    direction: DOWN
    timeout: 30000
- takeScreenshot: service-request-awaits-provider-quote
- tapOn:
    id: "sheet-close"
