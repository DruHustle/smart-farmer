appId: eu.onesa.smartfarmer
---
- tapOn:
    id: "tab-more"
- scrollUntilVisible:
    element:
      id: "workspace-language"
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "more-market"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "more-market"
- scrollUntilVisible:
    element:
      id: "listing-open-${LISTING_ID}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "listing-open-${LISTING_ID}"
- scrollUntilVisible:
    element:
      id: "form-quantity"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "form-quantity"
- inputText: "2"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "product-review"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "product-review"
- scrollUntilVisible:
    element:
      id: "product-confirm"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "product-confirm"
- extendedWaitUntil:
    notVisible:
      id: "product-confirm"
    timeout: 45000
- tapOn:
    id: "sheet-close"
- scrollUntilVisible:
    element:
      id: "market-tabs"
    direction: UP
    timeout: 30000
- tapOn:
    id: "market-tabs"
- tapOn:
    id: "market-tabs-option-orders"
- scrollUntilVisible:
    element:
      text: "Zvakachengeterwa odha"
    direction: DOWN
    timeout: 30000
- takeScreenshot: bag-priced-reservation-keeps-physical-stock
- tapOn:
    id: "sheet-close"
