appId: eu.onesa.smartfarmer
---
# Keep Expo's debug-only floating touch target away from real app controls.
# The offline restart supplies this URI again before interacting with app controls.
# On iOS, use the exact warmed Hermes bundle after the driver is ready.
# Expo supports direct bundle URLs; avoid its extra dynamic-manifest HEAD
# request, which can time out before loading any application code on CI.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: false
          permissions: {}
          arguments:
            "--initialUrl": "smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081%2Findex.bundle%3Fplatform%3Dios%26dev%3Dtrue%26hot%3Dfalse%26lazy%3Dtrue%26transform.engine%3Dhermes%26transform.bytecode%3D1%26transform.routerRoot%3Dapp%26unstable_transformProfile%3Dhermes-stable&__expo_disable_fab=1&disableFab=1"
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&disableFab=1
      - tapOn:
          text: Open
          optional: true
- extendedWaitUntil:
    visible: "^(Continue|System UI isn't responding)$"
    timeout: 120000
- runFlow:
    label: Recover the observed Android System UI startup dialog once
    when:
      platform: Android
      visible: "^System UI isn't responding$"
    commands:
      - takeScreenshot: android-system-ui-startup-dialog
      - tapOn: "^Wait$"
- extendedWaitUntil:
    visible: Continue
    timeout: 120000
- tapOn: Continue
- extendedWaitUntil:
    visible: Close
    timeout: 20000
- tapOn: Close
- extendedWaitUntil:
    visible:
      id: auth-username
    timeout: 120000
- takeScreenshot: signed-out-smart-farmer
- runFlow: credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-record
    timeout: 45000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: tab-record
- runFlow:
    when:
      platform: iOS
    commands:
      # AutoFill can consume the first tap while the signed-in screen appears.
      # Repeat only this navigation, as in the existing forum-offline journey.
      - repeat:
          times: 2
          while:
            notVisible:
              id: tab-record
              selected: true
          commands:
            - runFlow: dismiss-password-save.yaml
            - tapOn:
                id: tab-record
                enabled: true
      - runFlow: dismiss-password-save.yaml
      - extendedWaitUntil:
          visible:
            id: tab-record
            selected: true
          timeout: 5000
- scrollUntilVisible:
    element:
      id: record-note
    direction: DOWN
    timeout: 20000
- takeScreenshot: signed-in-sqlcipher-workspace
