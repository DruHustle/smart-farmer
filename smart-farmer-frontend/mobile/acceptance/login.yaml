appId: eu.onesa.smartfarmer
---
# Keep Expo's debug-only floating touch target away from real app controls.
# The offline restart supplies this URI again before interacting with app controls.
# On iOS, launch once after Maestro has initialized its driver.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: false
          permissions: {}
          arguments:
            "--initialUrl": "smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&disableFab=1"
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&disableFab=1
      - tapOn:
          text: Open
          optional: true
- extendedWaitUntil:
    visible: "^(Continue|System UI isn't responding)$"
    timeout: 120000
- runFlow:
    label: Recover the observed Android System UI startup dialog once
    when:
      platform: Android
      visible: "^System UI isn't responding$"
    commands:
      - takeScreenshot: android-system-ui-startup-dialog
      - tapOn: "^Wait$"
- extendedWaitUntil:
    visible: Continue
    timeout: 120000
- tapOn: Continue
- extendedWaitUntil:
    visible: Close
    timeout: 20000
- tapOn: Close
- extendedWaitUntil:
    visible:
      id: auth-username
    timeout: 120000
- runFlow: credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-record
    timeout: 45000
- runFlow:
    label: Dismiss the iOS password-save sheet after synthetic sign-in
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Not Now$'
          below: '^Securely store your password so it’s filled automatically the next time you need it\.$'
          optional: true
      - assertNotVisible: '^Save Password\?$'
- tapOn:
    id: tab-record
- scrollUntilVisible:
    element:
      id: record-note
    direction: DOWN
    timeout: 20000
- takeScreenshot: signed-in-sqlcipher-workspace
