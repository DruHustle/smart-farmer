appId: eu.onesa.smartfarmer
---
# Keep Expo's debug-only floating touch target away from real app controls.
# The launcher preference also persists across this disposable install's restarts.
- openLink: smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&disableFab=1
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: "^(Continue|System UI isn't responding)$"
    timeout: 120000
- runFlow:
    label: Recover the observed Android System UI startup dialog once
    when:
      platform: Android
      visible: "^System UI isn't responding$"
    commands:
      - takeScreenshot: android-system-ui-startup-dialog
      - tapOn: "^Wait$"
- extendedWaitUntil:
    visible: Continue
    timeout: 120000
- tapOn: Continue
- extendedWaitUntil:
    visible: Close
    timeout: 20000
- tapOn: Close
- extendedWaitUntil:
    visible:
      id: auth-username
    timeout: 120000
- runFlow: credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-record
    timeout: 45000
- tapOn:
    id: tab-record
- scrollUntilVisible:
    element:
      id: record-note
    direction: DOWN
    timeout: 20000
- takeScreenshot: signed-in-sqlcipher-workspace
