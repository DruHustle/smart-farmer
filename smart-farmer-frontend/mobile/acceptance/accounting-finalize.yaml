appId: eu.onesa.smartfarmer
---
- scrollUntilVisible:
    centerElement: true
    element:
      id: "invoice-finalize"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "invoice-finalize"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "invoice-confirm-finalize"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "invoice-confirm-finalize"
    enabled: false
- scrollUntilVisible:
    centerElement: true
    element:
      id: "invoice-reviewed"
    direction: UP
    timeout: 30000
- tapOn:
    id: "invoice-reviewed"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          centerElement: true
          element:
            id: "invoice-confirm-finalize"
          direction: DOWN
          timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      # A fully visible footer cannot always be centered in the review sheet.
      # Scroll only when the reviewed confirmation is not already available.
      - runFlow:
          when:
            notVisible:
              id: "invoice-confirm-finalize"
              enabled: true
          commands:
            - scrollUntilVisible:
                element:
                  id: "invoice-confirm-finalize"
                  enabled: true
                direction: DOWN
                timeout: 30000
- tapOn:
    id: "invoice-confirm-finalize"
- extendedWaitUntil:
    notVisible:
      id: "invoice-confirm-finalize"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "invoice-status"
    direction: UP
    timeout: 30000
- assertVisible:
    id: "invoice-status"
    text: "${FINAL_STATUS}"
