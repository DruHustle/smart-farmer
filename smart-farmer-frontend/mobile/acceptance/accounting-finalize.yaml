appId: eu.onesa.smartfarmer
---
- scrollUntilVisible:
    centerElement: true
    element:
      id: "invoice-finalize"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "invoice-finalize"
- scrollUntilVisible:
    element:
      id: "invoice-confirm-finalize"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "invoice-confirm-finalize"
    enabled: false
- scrollUntilVisible:
    centerElement: true
    element:
      id: "invoice-reviewed"
    direction: UP
    timeout: 30000
- tapOn:
    id: "invoice-reviewed"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          centerElement: true
          element:
            id: "invoice-confirm-finalize"
          direction: DOWN
          timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      # iOS can report a footer visible when its center is clipped by the sheet.
      # Scroll inside the sheet's content, away from the Switch's touch handler,
      # before the single finalization tap. Swiping on the Switch toggles it.
      - assertVisible:
          id: "invoice-reviewed"
          checked: true
      - swipe:
          start: "50%,75%"
          end: "50%,35%"
          duration: 600
      - assertVisible:
          id: "invoice-reviewed"
          checked: true
      - assertVisible:
          id: "invoice-confirm-finalize"
          enabled: true
- tapOn:
    id: "invoice-confirm-finalize"
    enabled: true
- extendedWaitUntil:
    notVisible:
      id: "invoice-confirm-finalize"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "invoice-status"
    direction: UP
    timeout: 30000
- assertVisible:
    id: "invoice-status"
    text: "${FINAL_STATUS}"
