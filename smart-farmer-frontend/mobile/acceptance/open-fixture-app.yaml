appId: eu.onesa.smartfarmer
---
# Keep Expo's debug-only floating touch target away from real app controls.
# The offline restart supplies this URI again before interacting with app controls.
# On iOS, use the exact warmed Hermes bundle after the driver is ready.
# Expo supports direct bundle URLs and still probes their content type with HEAD.
# The helper retries once only from the observed pre-auth launcher fallback.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: ios-launch-bundle.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&disableFab=1
      - tapOn:
          text: Open
          optional: true
- extendedWaitUntil:
    visible: "^(Continue|System UI isn't responding)$"
    timeout: 120000
- runFlow:
    label: Recover the observed Android System UI startup dialog once
    when:
      platform: Android
      visible: "^System UI isn't responding$"
    commands:
      - takeScreenshot: android-system-ui-startup-dialog
      - tapOn: "^Wait$"
- extendedWaitUntil:
    visible: Continue
    timeout: 120000
- tapOn: Continue
- extendedWaitUntil:
    visible: Close
    timeout: 20000
- tapOn: Close
# iPad iOS 26.4 receipt: after Expo's initial Continue/Close, a second
# *developer-only* tutorial covered the genuine signed-out Farmer form.
# Only dismiss that exact observed tutorial; never touch auth/session controls.
- runFlow:
    label: Dismiss the observed Expo developer-menu tutorial on iOS
    when:
      platform: iOS
      visible: '^This is the developer menu\\. It gives you access to useful tools in development builds\\.
- takeScreenshot: signed-out-smart-farmer

    commands:
      - tapOn:
          text: '^Continue
- takeScreenshot: signed-out-smart-farmer

      - runFlow:
          when:
            visible: '^Close
- takeScreenshot: signed-out-smart-farmer

          commands:
            - tapOn: '^Close
- takeScreenshot: signed-out-smart-farmer

- extendedWaitUntil:
    visible:
      id: auth-username
    timeout: 120000
- takeScreenshot: signed-out-smart-farmer
