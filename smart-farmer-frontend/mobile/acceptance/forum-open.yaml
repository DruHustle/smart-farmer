appId: eu.onesa.smartfarmer
---
# Only read-only tab navigation is bounded; publication is never retried.
- repeat:
    times: 2
    while:
      notVisible:
        id: tab-forum
        selected: true
    commands:
      # AutoFill can arrive when a new XCTest session takes over after login,
      # covering every app tab. Decline only Apple's observed password sheet
      # before read-only navigation; the offline publication still runs once.
      - runFlow:
          when:
            platform: iOS
            visible: '^Save Password[?]$'
          commands:
            - runFlow: dismiss-password-save.yaml
      - tapOn:
          id: tab-forum
          enabled: true
- extendedWaitUntil:
    visible:
      id: tab-forum
      selected: true
    timeout: 5000
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      id: forum-new
      enabled: true
    centerElement: true
    direction: DOWN
    timeout: 30000
