appId: eu.onesa.smartfarmer
---
- tapOn:
    id: tab-record
- scrollUntilVisible:
    centerElement: true
    element:
      id: media-camera
    direction: DOWN
    # One observed iOS XCTest swipe took 22s; allow the driver to recheck the
    # visible control after that gesture instead of expiring its 20s default.
    timeout: 45000
- tapOn:
    id: media-camera
- runFlow:
    when:
      platform: Android
    commands:
      # A denied launch may still permit the first OS permission request.
      # Explicitly deny that camera request; never grant access in this flow.
      - tapOn:
          id: '^(com[.]android|com[.]google[.]android)[.]permissioncontroller:id/permission_deny(_and_dont_ask_again)?_button$'
          optional: true
# Wait for the native permission result before moving the workspace. An upward
# search while the request is pending can reach pull-to-refresh as it resolves.
- extendedWaitUntil:
    visible:
      id: media-camera
      enabled: true
    timeout: 45000
- scrollUntilVisible:
    element:
      text: '.*Mvumo haina kupiwa.*'
    direction: UP
- takeScreenshot: camera-permission-denied-recording-remains-available
# Cached Record UI can appear before the restored private outbox is acknowledged.
# Observe completion without pressing Sync/Retry, then restore the Record workspace.
- tapOn:
    id: tab-more
    enabled: true
- extendedWaitUntil:
    visible:
      id: tab-more
      selected: true
    timeout: 5000
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
    timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          centerElement: true
          element:
            id: more-sync
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: more-sync
          enabled: true
- runFlow:
    when:
      platform: iOS
    commands:
      # Stop scrolling once the read-only queue entry is completely visible.
      - scrollUntilVisible:
          element:
            id: more-sync
          visibilityPercentage: 100
          centerElement: false
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: more-sync
          enabled: true
      # A moving list can absorb a tap. The same navigation row may be tapped
      # once more only while the outbox panel is still absent.
      - runFlow:
          when:
            notVisible: '^Zvakamirira kuenderaniswa$'
          commands:
            - tapOn:
                id: more-sync
                enabled: true
                optional: true
      - extendedWaitUntil:
          visible: '^Zvakamirira kuenderaniswa$'
          timeout: 20000
- extendedWaitUntil:
    visible:
      text: '^Hapana chakamirira kutumirwa[.]$'
    timeout: 20000
- tapOn:
    id: sheet-close
- tapOn:
    id: tab-record
    enabled: true
- extendedWaitUntil:
    visible:
      id: tab-record
      selected: true
    timeout: 5000
