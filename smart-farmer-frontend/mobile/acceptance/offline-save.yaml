appId: eu.onesa.smartfarmer
---
- runFlow: forum-offline.yaml
- tapOn:
    id: record-note
- inputText: Native durable offline observation
- runFlow: dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: "record-note"
    direction: UP
    timeout: 20000
- assertVisible:
    id: "record-note"
    text: '(?-i)^Native durable offline observation$'
# Save can be fully visible below mid-screen at the end of this form.
# Scroll only as far as needed to reach the button and submit exactly once.
- scrollUntilVisible:
    element:
      id: record-save
    direction: DOWN
- tapOn:
    id: record-save
- tapOn:
    id: tab-more
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
- scrollUntilVisible:
    centerElement: true
    element:
      id: more-sync
    direction: DOWN
- assertVisible:
    id: more-sync
    text: '.*\(1\)$'
- tapOn:
    id: more-sync
- scrollUntilVisible:
    element:
      text: '^Native durable offline observation$'
    direction: DOWN
- assertVisible: '(?-i)^Native durable offline observation$'
- takeScreenshot: durable-pending-record-before-restart
