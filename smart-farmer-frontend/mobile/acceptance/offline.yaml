appId: eu.onesa.smartfarmer
---
- runFlow: forum-offline.yaml
- tapOn:
    id: record-note
- inputText: Native durable offline observation
- runFlow: dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: "record-note"
    direction: UP
    timeout: 20000
- assertVisible:
    id: "record-note"
    text: '(?-i)^Native durable offline observation$'
- scrollUntilVisible:
    centerElement: true
    element:
      id: record-save
    direction: DOWN
- tapOn:
    id: record-save
- tapOn:
    id: tab-more
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
- scrollUntilVisible:
    centerElement: true
    element:
      id: more-sync
    direction: DOWN
- assertVisible:
    id: more-sync
    text: '.*\(1\)$'
- tapOn:
    id: more-sync
- scrollUntilVisible:
    element:
      text: '^Native durable offline observation$'
    direction: DOWN
- assertVisible: '(?-i)^Native durable offline observation$'
- takeScreenshot: durable-pending-record-before-restart
- stopApp
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          stopApp: false
          # Android revocation terminates a live process. Configure denial at this
          # existing cold-start boundary, before reauthentication and reconciliation.
          permissions:
            all: allow
            camera: deny
      - openLink: smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&disableFab=1
      - tapOn:
          text: Open
          optional: true
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: false
          permissions:
            all: allow
            camera: deny
          # Pass the same URI on this cold launch without an external Open dialog.
          arguments:
            "--initialUrl": smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081%2Findex.bundle%3Fplatform%3Dios%26dev%3Dtrue%26hot%3Dfalse%26lazy%3Dtrue%26transform.engine%3Dhermes%26transform.bytecode%3D1%26transform.routerRoot%3Dapp%26unstable_transformProfile%3Dhermes-stable&__expo_disable_fab=1&disableFab=1
- extendedWaitUntil:
    visible:
      id: device-reauthenticate
    timeout: 60000
- assertVisible:
    id: device-unlock
- takeScreenshot: restart-keeps-private-workspace-locked
