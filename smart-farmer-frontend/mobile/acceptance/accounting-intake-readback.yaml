appId: eu.onesa.smartfarmer
---
- extendedWaitUntil:
    visible:
      id: tab-more
    timeout: 45000
- runFlow: accounting-intake-open.yaml
- scrollUntilVisible:
    element:
      id: invoice-local-source-image
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: invoice-local-source-image
- scrollUntilVisible:
    element:
      id: '^invoice-upload-[0-9a-f-]+$'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: '^invoice-upload-[0-9a-f-]+$'
