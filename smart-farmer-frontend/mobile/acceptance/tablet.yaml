appId: eu.onesa.smartfarmer
---
# XCTest can report the Farm tab selected while Maestro's selected-state
# matcher returns false. Require the actual farm-specific project entry instead
# of weakening the user journey to a tab-only visibility assertion.
# At most two read-only navigation taps are permitted before any project action.
- repeat:
    times: 2
    while:
      notVisible:
        id: project-open-${PROJECT_ID}
    commands:
      - tapOn:
          id: "tab-farm"
          enabled: true
- extendedWaitUntil:
    visible:
      id: project-open-${PROJECT_ID}
    timeout: 5000
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
- runFlow:
    when:
      notVisible:
        id: project-open-${PROJECT_ID}
    commands:
      - scrollUntilVisible:
          element:
            id: project-open-${PROJECT_ID}
          direction: DOWN
- takeScreenshot: ipad-large-font-farm-overview
- tapOn:
    id: project-open-${PROJECT_ID}
# An acknowledged iPad tap can be lost to an OS overlay immediately after
# restored sign-in. Retry one read-only navigation touch only while the
# project's modal close control is absent. The suite still requires the
# actual workspace chooser, performance panel and finance records.
- runFlow:
    when:
      notVisible:
        id: sheet-close
    commands:
      - runFlow:
          when:
            visible:
              id: project-open-${PROJECT_ID}
          commands:
            - tapOn:
                id: project-open-${PROJECT_ID}
                enabled: true
- runFlow:
    when:
      notVisible:
        id: project-workspace
    commands:
      - scrollUntilVisible:
          element:
            id: project-workspace
          direction: DOWN
- tapOn:
    id: project-workspace
# Acknowledged iPad taps can leave the project chooser closed. Reopen it
# once only when its own enabled button is still on the original sheet.
- runFlow:
    when:
      notVisible:
        id: project-workspace-option-performance
    commands:
      - tapOn:
          id: project-workspace
          enabled: true
- tapOn:
    id: project-workspace-option-performance
- scrollUntilVisible:
    element:
      id: project-panel-performance
    direction: DOWN
    visibilityPercentage: 1
- takeScreenshot: ipad-large-font-project-performance
- tapOn:
    id: sheet-close
- tapOn:
    id: tab-more
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
- scrollUntilVisible:
    centerElement: true
    element:
      id: more-finance
    direction: DOWN
- tapOn:
    id: more-finance
- assertVisible:
    id: finance-tabs
- takeScreenshot: ipad-large-font-finance
- tapOn:
    id: sheet-close
- runFlow: product-language.yaml
- runFlow: forum-read.yaml
