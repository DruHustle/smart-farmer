appId: eu.onesa.smartfarmer
---
# A driver-acknowledged tap can leave Record selected after earlier journeys.
# Bound only this read-only navigation retry and require the actual Farm state.
- repeat:
    times: 2
    while:
      notVisible:
        id: "tab-farm"
        selected: true
    commands:
      - tapOn:
          id: "tab-farm"
          enabled: true
- extendedWaitUntil:
    visible:
      id: "tab-farm"
      selected: true
    timeout: 5000
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
- runFlow:
    when:
      notVisible:
        id: project-open-${PROJECT_ID}
    commands:
      - scrollUntilVisible:
          element:
            id: project-open-${PROJECT_ID}
          direction: DOWN
- takeScreenshot: ipad-large-font-farm-overview
- tapOn:
    id: project-open-${PROJECT_ID}
- runFlow:
    when:
      notVisible:
        id: project-workspace
    commands:
      - scrollUntilVisible:
          element:
            id: project-workspace
          direction: DOWN
- tapOn:
    id: project-workspace
# Acknowledged iPad taps can leave the project chooser closed. Reopen it
# once only when its own enabled button is still on the original sheet.
- runFlow:
    when:
      notVisible:
        id: project-workspace-option-performance
    commands:
      - tapOn:
          id: project-workspace
          enabled: true
- tapOn:
    id: project-workspace-option-performance
- scrollUntilVisible:
    element:
      id: project-panel-performance
    direction: DOWN
    visibilityPercentage: 1
- takeScreenshot: ipad-large-font-project-performance
- tapOn:
    id: sheet-close
- tapOn:
    id: tab-more
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
- scrollUntilVisible:
    centerElement: true
    element:
      id: more-finance
    direction: DOWN
- tapOn:
    id: more-finance
- assertVisible:
    id: finance-tabs
- takeScreenshot: ipad-large-font-finance
- tapOn:
    id: sheet-close
- runFlow: product-language.yaml
- runFlow: forum-read.yaml
