appId: eu.onesa.smartfarmer
---
# The system picker has returned. A draft and explicit upload consent are
# required in the installed app, both before and after the encrypted restart.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: invoice-library
            enabled: true
          timeout: 120000
- scrollUntilVisible:
    element:
      id: invoice-local-source-image
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: invoice-local-source-image
- scrollUntilVisible:
    element:
      id: '^invoice-upload-[0-9a-f-]+$'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: '^invoice-upload-[0-9a-f-]+$'
# An unuploaded private source must survive a real process restart.
- stopApp
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          stopApp: false
          permissions:
            all: unset
      - openLink: smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&disableFab=1
      - tapOn:
          text: Open
          optional: true
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: false
          permissions:
            all: unset
          arguments:
            "--initialUrl": smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081%2Findex.bundle%3Fplatform%3Dios%26dev%3Dtrue%26hot%3Dfalse%26lazy%3Dtrue%26transform.engine%3Dhermes%26transform.bytecode%3D1%26transform.routerRoot%3Dapp%26unstable_transformProfile%3Dhermes-stable&__expo_disable_fab=1&disableFab=1
      - runFlow: ios-resume-locked-bundle.yaml
- extendedWaitUntil:
    visible:
      id: device-reauthenticate
    timeout: 60000
- tapOn:
    id: device-reauthenticate
- extendedWaitUntil:
    visible:
      id: auth-username
    timeout: 20000
- runFlow: credentials.yaml
- runFlow: accounting-intake-readback.yaml
