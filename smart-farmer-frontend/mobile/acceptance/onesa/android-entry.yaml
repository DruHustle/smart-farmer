appId: eu.onesa.smartfarmer
env:
  FLOW_STATE: cold
---
- runFlow:
    when:
      true: ${FLOW_STATE !== 'active'}
    commands:
      - runFlow: entry.yaml
      - runFlow: open.yaml
      - extendedWaitUntil:
          visible: '^Email address$'
          timeout: 45000
- runFlow:
    when:
      true: ${FLOW_STATE === 'active'}
    commands:
      - stopApp
      - runFlow: launch.yaml
      - extendedWaitUntil:
          visible: {id: device-reauthenticate}
          timeout: 120000
      - tapOn: {id: device-reauthenticate}
      - extendedWaitUntil:
          visible: {id: auth-onesa}
          timeout: 30000
      - runFlow: open.yaml
      - extendedWaitUntil:
          visible: '^(Continue as .*|Dzokera muSmart Farmer|Buyela ku-Smart Farmer)$'
          timeout: 45000
