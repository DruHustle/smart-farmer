appId: eu.onesa.smartfarmer
---
- runFlow: ios-entry.yaml
# No operating-system action starts a new authorization after this point.
- runFlow: ios-portal-open.yaml
- runFlow:
    when:
      true: ${FLOW_STATE === 'cold'}
    commands:
      - runFlow: ios-enter-email.yaml
      - runFlow: cold.yaml
- runFlow:
    when:
      true: ${FLOW_STATE === 'active'}
    file: active.yaml
- runFlow:
    when:
      true: ${FLOW_STATE === 'cancel'}
    file: cancel.yaml
