appId: eu.onesa.smartfarmer
---
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: ../ios-launch-bundle.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: launch.yaml
- extendedWaitUntil:
    visible: '^Continue$'
    timeout: 120000
- tapOn: '^Continue$'
- tapOn: '^Close$'
- extendedWaitUntil:
    visible: {id: auth-onesa}
    timeout: 120000
- takeScreenshot: signed-out-smart-farmer
