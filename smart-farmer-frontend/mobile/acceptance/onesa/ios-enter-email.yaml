appId: eu.onesa.smartfarmer
---
- extendedWaitUntil:
    visible: '^Email address$'
    timeout: 45000
- tapOn: '^Email address$'
# A newly erased iPhone can present its typing tutorial on first focus.
- tapOn:
    text: '^Continue$'
    below: '^Speed up your typing by sliding your finger across the letters to compose a word\.$'
    optional: true
- assertNotVisible:
    id: UIContinuousPathIntroductionView
# A WebKit field can be visible before the first tap raises the keyboard.
- runFlow:
    when:
      notVisible: {id: '^inputView$'}
    commands:
      - tapOn: '^Email address$'
- extendedWaitUntil:
    visible: {id: '^inputView$'}
    timeout: 10000
- inputText: ${EMAIL}
- runFlow: dismiss-browser-keyboard.yaml
# Read the named WebKit control in this driver session. A blank or partial
# fixture email may be corrected once before the form has been submitted.
- copyTextFrom: '^Email address$'
- runFlow:
    when:
      true: ${typeof maestro.copiedText === 'string' && maestro.copiedText !== EMAIL && EMAIL.startsWith(maestro.copiedText)}
    commands:
      - tapOn:
          text: '^Email address$'
          point: '95%,50%'
      - extendedWaitUntil:
          visible: {id: '^inputView$'}
          timeout: 10000
      - eraseText: 100
      - inputText: ${EMAIL}
      - runFlow: dismiss-browser-keyboard.yaml
# Some WebKit snapshots expose only the static label. The actual issuer
# response, one native exchange, and exact database subject verify submission.
# WebKit can expose just the accessibility label for a secure input. Type only
# after tapping its named control and observing its software keyboard.
- tapOn: '^Password$'
# A WebKit field can be visible before the first tap raises the keyboard.
- runFlow:
    when:
      notVisible: {id: '^inputView$'}
    commands:
      - tapOn: '^Password$'
- extendedWaitUntil:
    visible: {id: '^inputView$'}
    timeout: 10000
- inputText: ${PASSWORD}
- runFlow: dismiss-browser-keyboard.yaml
