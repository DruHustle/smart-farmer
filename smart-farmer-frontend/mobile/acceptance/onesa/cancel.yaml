appId: eu.onesa.smartfarmer
---
- runFlow: entry.yaml
- runFlow: open.yaml
- scrollUntilVisible:
    element: '^Cancel sign-in$'
    direction: DOWN
    timeout: 45000
- tapOn: '^Cancel sign-in$'
- takeScreenshot: private-only-cancel-choice-tapped
- runFlow: callback.yaml
- takeScreenshot: private-only-return-link-tapped
- extendedWaitUntil:
    visible: '^(Onesa haina kupa mvumo yekupinda muSmart Farmer[.]|I-Onesa kayinikanga imvumo yokungena ku-Smart Farmer[.])$'
    timeout: 30000
- takeScreenshot: private-only-native-denial-visible
- assertVisible: {id: auth-onesa}
- assertNotVisible: {id: tab-forum}
- takeScreenshot: private-only-signed-out-confirmed
