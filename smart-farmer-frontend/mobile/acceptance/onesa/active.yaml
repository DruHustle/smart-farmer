appId: eu.onesa.smartfarmer
---
- stopApp
- runFlow: launch.yaml
- extendedWaitUntil:
    visible: {id: device-reauthenticate}
    timeout: 120000
- tapOn: {id: device-reauthenticate}
- extendedWaitUntil:
    visible: {id: auth-onesa}
    timeout: 30000
- runFlow: open.yaml
# Some authorized Portal devices immediately return to the product bridge.
- extendedWaitUntil:
    visible: '^(Continue as .*|Dzokera muSmart Farmer|Buyela ku-Smart Farmer)$'
    timeout: 45000
- runFlow:
    when:
      visible: '^Continue as .*'
    commands:
      - tapOn: 'Continue as ${EMAIL}'
- runFlow: callback.yaml
- extendedWaitUntil:
    visible: {id: forum-new}
    timeout: 45000
- assertVisible: {id: tab-forum, selected: true}
- assertVisible: ${FARM_NAME}
- scrollUntilVisible:
    element: ${FORUM_TITLE}
    direction: DOWN
