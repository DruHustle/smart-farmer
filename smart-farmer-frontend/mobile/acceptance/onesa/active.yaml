appId: eu.onesa.smartfarmer
---
# Some authorized Portal devices immediately return to the product bridge.
- extendedWaitUntil:
    visible: '^(Continue as .*|Dzokera muSmart Farmer|Buyela ku-Smart Farmer)$'
    timeout: 45000
- runFlow:
    when:
      visible: '^Continue as .*'
    commands:
      - tapOn: 'Continue as ${EMAIL}'
- runFlow: callback.yaml
- runFlow: active-workspace.yaml
