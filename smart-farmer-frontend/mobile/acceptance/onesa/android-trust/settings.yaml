appId: com.android.settings
---
- scrollUntilVisible:
    element: '^Encryption & credentials$'
    direction: DOWN
- tapOn: '^Encryption & credentials$'
- scrollUntilVisible:
    element: '^Install a certificate$'
    direction: DOWN
- tapOn: '^Install a certificate$'
- tapOn: '^CA certificate$'
- scrollUntilVisible:
    element: '^Install anyway$'
    direction: DOWN
- tapOn: '^Install anyway$'
- runFlow: unlock.yaml
- runFlow:
    when:
      notVisible: '^farmer-device-ca[.]crt$'
    commands:
      - tapOn:
          text: '^(Show roots|Open navigation drawer|Open from)$'
      - tapOn: '^Onesa test issuer$'
- tapOn: '^farmer-device-ca[.]crt$'
- runFlow: unlock.yaml
- tapOn:
    text: '^(OK|Install)$'
    optional: true
