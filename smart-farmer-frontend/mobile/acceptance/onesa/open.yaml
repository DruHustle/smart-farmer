appId: eu.onesa.smartfarmer
---
- tapOn:
    id: auth-onesa
- runFlow:
    when:
      platform: iOS
    commands:
      # The simulator can present the bundle name or its display name. Consent
      # can also finish between the accessibility query and the targeted tap.
      - extendedWaitUntil:
          visible: '^(“Smart ?Farmer” Wants to Use “localhost” to Sign In|Sign in to Onesa|Email address|Cancel sign-in|Continue as .*|Dzokera muSmart Farmer|Buyela ku-Smart Farmer)$'
          timeout: 45000
      - runFlow:
          when:
            visible: '^“Smart ?Farmer” Wants to Use “localhost” to Sign In$'
          commands:
            - tapOn:
                text: '^Continue$'
                below: '^“Smart ?Farmer” Wants to Use “localhost” to Sign In$'
                optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: '^(Use without an account|Accept & continue|Continue without an account|Stay signed out)$'
          optional: true
      - tapOn:
          text: '^(No thanks|Got it)$'
          optional: true
