appId: eu.onesa.smartfarmer
---
# Start Farmer once. The calling flow continues on the live browser sheet.
- assertTrue: ${['cancel', 'cold', 'active'].includes(FLOW_STATE)}
- runFlow:
    when:
      true: ${FLOW_STATE !== 'active'}
    commands:
      - runFlow: entry.yaml
- runFlow:
    when:
      true: ${FLOW_STATE === 'active'}
    commands:
      - stopApp
      - runFlow: launch.yaml
      - extendedWaitUntil:
          visible: {id: device-reauthenticate}
          timeout: 120000
      - tapOn: {id: device-reauthenticate}
      - extendedWaitUntil:
          visible: {id: auth-onesa}
          timeout: 30000
- runFlow: open.yaml
