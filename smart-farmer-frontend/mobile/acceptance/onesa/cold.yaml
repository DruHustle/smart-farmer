appId: eu.onesa.smartfarmer
---
- runFlow: launch.yaml
- extendedWaitUntil:
    visible: '^Continue$'
    timeout: 120000
- tapOn: '^Continue$'
- tapOn: '^Close$'
- extendedWaitUntil:
    visible: {id: auth-onesa}
    timeout: 120000
- runFlow: open.yaml
- extendedWaitUntil:
    visible: '^Email address$'
    timeout: 45000
- tapOn: '^Email address$'
- inputText: ${EMAIL}
- tapOn: '^Password$'
- inputText: ${PASSWORD}
# Remembering the browser is a normal Portal control. The active test must use
# the OS browser cookies. It never supplies another password or recovery code.
- scrollUntilVisible:
    element: '^Remember this browser$'
    direction: DOWN
- tapOn: '^Remember this browser$'
- scrollUntilVisible:
    element: '^Continue$'
    direction: DOWN
- tapOn: '^Continue$'
- runFlow:
    when:
      true: ${ROLE === 'admin'}
    commands:
      - extendedWaitUntil:
          visible: '^Authenticator or recovery code$'
          timeout: 30000
      - tapOn: '^Authenticator or recovery code$'
      - inputText: ${MFA}
      - scrollUntilVisible:
          element: '^Continue$'
          direction: DOWN
      - tapOn: '^Continue$'
- runFlow: callback.yaml
- extendedWaitUntil:
    visible: {id: first-farm-invitation}
    timeout: 45000
- assertNotVisible: {id: tab-forum}
- tapOn: {id: first-farm-invitation}
- inputText: ${INVITE}
- runFlow: ../dismiss-keyboard.yaml
- scrollUntilVisible:
    element: {id: first-farm-join}
    direction: DOWN
- tapOn: {id: first-farm-join}
- extendedWaitUntil:
    visible: {id: tab-forum}
    timeout: 45000
- assertVisible: ${FARM_NAME}
- tapOn: {id: tab-forum}
- extendedWaitUntil:
    visible: {id: forum-new}
    timeout: 30000
- scrollUntilVisible:
    element: ${FORUM_TITLE}
    direction: DOWN
