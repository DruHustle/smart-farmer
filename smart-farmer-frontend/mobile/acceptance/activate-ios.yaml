appId: eu.onesa.smartfarmer
---
# A fresh XCTest driver session does not establish the app's input focus.
# Bring the existing process forward without resetting its SQLCipher state,
# session or unsaved form. Permissions remain unset for explicit OS-prompt
# handling in the relevant flow. Every separate iOS journey uses this.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: false
          permissions:
            all: unset
