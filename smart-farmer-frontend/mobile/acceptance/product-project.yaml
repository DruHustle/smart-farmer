appId: eu.onesa.smartfarmer
---
# A driver-acknowledged tap can leave Record selected after earlier journeys.
# Bound only this read-only navigation retry and require the actual Farm state.
- repeat:
    times: 2
    while:
      notVisible:
        id: "tab-farm"
        selected: true
    commands:
      - tapOn:
          id: "tab-farm"
          enabled: true
- extendedWaitUntil:
    visible:
      id: "tab-farm"
      selected: true
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "workspace-language"
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    centerElement: true
    element:
      id: "project-open-${PROJECT_ID}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "project-open-${PROJECT_ID}"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "project-workspace"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "project-workspace"
- scrollUntilVisible:
    element:
      id: "project-workspace-option-planning"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "project-workspace-option-planning"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "plan-approve-${PLAN_ID}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "plan-approve-${PLAN_ID}"
- tapOn:
    id: "action-confirm"
- extendedWaitUntil:
    notVisible:
      id: "action-confirm"
    timeout: 45000
- takeScreenshot: sourced-plan-approved-once
- scrollUntilVisible:
    centerElement: true
    element:
      id: "project-workspace"
    direction: UP
    timeout: 30000
- tapOn:
    id: "project-workspace"
- tapOn:
    id: "project-workspace-option-assessments"
- scrollUntilVisible:
    element:
      id: "project-panel-assessments"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 1
- assertVisible:
    id: project-panel-assessments
- scrollUntilVisible:
    centerElement: true
    element:
      id: "project-workspace"
    direction: UP
    timeout: 30000
- tapOn:
    id: "project-workspace"
- tapOn:
    id: "project-workspace-option-performance"
- scrollUntilVisible:
    element:
      id: "project-panel-performance"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 1
- assertVisible:
    id: project-panel-performance
- takeScreenshot: project-performance-and-missing-data
- scrollUntilVisible:
    centerElement: true
    element:
      id: "project-workspace"
    direction: UP
    timeout: 30000
- tapOn:
    id: "project-workspace"
- tapOn:
    id: "project-workspace-option-history"
- scrollUntilVisible:
    element:
      id: "project-panel-history"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 1
- assertVisible:
    id: project-panel-history
- scrollUntilVisible:
    centerElement: true
    element:
      id: "project-workspace"
    direction: UP
    timeout: 30000
- tapOn:
    id: "project-workspace"
- tapOn:
    id: "project-workspace-option-companion"
- scrollUntilVisible:
    element:
      id: "project-panel-companion"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 1
- assertVisible:
    id: project-panel-companion
- tapOn:
    id: "sheet-close"
