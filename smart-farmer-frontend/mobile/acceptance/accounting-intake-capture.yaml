appId: eu.onesa.smartfarmer
---
- runFlow: activate-ios.yaml
# The simulator setup imports the PNG into Apple Photos before XCTest starts.
# Android uses the same generated PNG in its real system MediaStore.
- runFlow:
    when:
      platform: Android
    commands:
      - addMedia:
          - assets/native-supplier-invoice.png
- runFlow: accounting-intake-open.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: invoice-library
    direction: DOWN
    timeout: 30000
- tapOn:
    id: invoice-library
# Strict OS selectors: if the pinned simulator changes, retain its real hierarchy
# and fail. Do not substitute coordinates, optional taps or a mocked picker.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: '^Photo taken on .+$'
      - tapOn:
          text: '^Photo taken on .+$'
          index: 0
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: PXGGridLayout-Info
      - tapOn:
          id: PXGGridLayout-Info
          index: 0
      # iOS returns focus before its selected image has finished processing.
      # The capture control re-enables after local persistence and refresh.
      - extendedWaitUntil:
          visible:
            id: invoice-library
            enabled: true
          timeout: 120000
- scrollUntilVisible:
    element:
      id: invoice-local-source-image
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: invoice-local-source-image
- scrollUntilVisible:
    element:
      id: '^invoice-upload-[0-9a-f-]+$'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: '^invoice-upload-[0-9a-f-]+$'
# An unuploaded private source must survive a real process restart.
- stopApp
- launchApp:
    stopApp: false
    permissions:
      all: unset
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: smartfarmer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&disableFab=1
      - tapOn:
          text: Open
          optional: true
- extendedWaitUntil:
    visible:
      id: device-reauthenticate
    timeout: 60000
- tapOn:
    id: device-reauthenticate
- extendedWaitUntil:
    visible:
      id: auth-username
    timeout: 20000
- runFlow: credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-more
    timeout: 45000
- runFlow: accounting-intake-open.yaml
- scrollUntilVisible:
    element:
      id: invoice-local-source-image
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: invoice-local-source-image
- scrollUntilVisible:
    element:
      id: '^invoice-upload-[0-9a-f-]+$'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: '^invoice-upload-[0-9a-f-]+$'
