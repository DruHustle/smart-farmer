appId: eu.onesa.smartfarmer
---
- runFlow: activate-ios.yaml
- tapOn:
    id: device-reauthenticate
- extendedWaitUntil:
    visible:
      id: auth-username
    timeout: 20000
- runFlow: credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-record
    timeout: 45000
- tapOn:
    id: tab-record
- scrollUntilVisible:
    centerElement: true
    element:
      id: media-camera
    direction: DOWN
- tapOn:
    id: media-camera
- runFlow:
    when:
      platform: Android
    commands:
      # A denied launch may still permit the first OS permission request.
      # Explicitly deny that camera request; never grant access in this flow.
      - tapOn:
          id: '^(com[.]android|com[.]google[.]android)[.]permissioncontroller:id/permission_deny(_and_dont_ask_again)?_button$'
          optional: true
- runFlow:
    when:
      platform: iOS
    commands:
      # Foreground activation leaves this permission unset on the simulator.
      # Deny the real OS prompt before asserting the application's error.
      - tapOn:
          text: "^Don['’]t Allow$"
- scrollUntilVisible:
    element:
      text: '.*Mvumo haina kupiwa.*'
    direction: UP
- takeScreenshot: camera-permission-denied-recording-remains-available
# Cached Record UI can appear before the restored private outbox is acknowledged.
# Observe completion without pressing Sync/Retry, then restore the Record workspace.
- tapOn:
    id: tab-more
    enabled: true
- extendedWaitUntil:
    visible:
      id: tab-more
      selected: true
    timeout: 5000
- scrollUntilVisible:
    element:
      id: workspace-language
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    centerElement: true
    element:
      id: more-sync
    direction: DOWN
    timeout: 20000
- tapOn:
    id: more-sync
    enabled: true
- extendedWaitUntil:
    visible:
      text: '^Hapana chakamirira kutumirwa[.]$'
    timeout: 20000
- tapOn:
    id: sheet-close
- tapOn:
    id: tab-record
    enabled: true
- extendedWaitUntil:
    visible:
      id: tab-record
      selected: true
    timeout: 5000
