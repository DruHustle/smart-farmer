appId: eu.onesa.smartfarmer
---
- tapOn:
    id: device-reauthenticate
- extendedWaitUntil:
    visible:
      id: auth-username
    timeout: 20000
- runFlow: credentials.yaml
- extendedWaitUntil:
    visible:
      id: tab-record
    timeout: 45000
- tapOn:
    id: tab-record
- setPermissions:
    permissions:
      camera: deny
- scrollUntilVisible:
    element:
      id: media-camera
    direction: DOWN
- tapOn:
    id: media-camera
- scrollUntilVisible:
    element:
      text: '.*Mvumo haina kupiwa.*'
    direction: UP
- takeScreenshot: camera-permission-denied-recording-remains-available
