appId: eu.onesa.smartfarmer
---
- scrollUntilVisible:
    element:
      id: auth-username
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-username
- runFlow:
    label: Dismiss only the observed iOS first-use keyboard tutorial
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Continue$'
          below: '^Speed up your typing by sliding your finger across the letters to compose a word\\.$'
          optional: true
      - assertNotVisible:
          id: UIContinuousPathIntroductionView
- eraseText: 80
# iOS 26 XCTest can acknowledge bulk typing while the RN native field keeps
# only a subset of keystrokes (verified 2026-11-21: clipboard command left
# "nr" instead of "native_owner"). Use per-key input with an exact, visible
# accessibility-value checkpoint after EVERY character. This synchronizes
# the native field and JS onChangeText updates before sending the next key.
# No password or session request occurs unless all 12 checks pass.
- inputText: n
- assertVisible:
    id: auth-username
    text: '^n$'
- inputText: a
- assertVisible:
    id: auth-username
    text: '^na$'
- inputText: t
- assertVisible:
    id: auth-username
    text: '^nat$'
- inputText: i
- assertVisible:
    id: auth-username
    text: '^nati$'
- inputText: v
- assertVisible:
    id: auth-username
    text: '^nativ$'
- inputText: e
- assertVisible:
    id: auth-username
    text: '^native$'
- inputText: _
- assertVisible:
    id: auth-username
    text: '^native_$'
- inputText: o
- assertVisible:
    id: auth-username
    text: '^native_o$'
- inputText: w
- assertVisible:
    id: auth-username
    text: '^native_ow$'
- inputText: n
- assertVisible:
    id: auth-username
    text: '^native_own$'
- inputText: e
- assertVisible:
    id: auth-username
    text: '^native_owne$'
- inputText: r
- assertVisible:
    id: auth-username
    text: '^native_owner$'
- runFlow:
    label: Dismiss the visible iOS keyboard through the app control
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: keyboard-dismiss
          timeout: 20000
      - tapOn:
          id: keyboard-dismiss
- runFlow:
    label: Dismiss the Android keyboard without submitting the form
    when:
      platform: Android
    commands:
      - pressKey: Back
- assertVisible:
    id: auth-username
    text: '^native_owner$'
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-password
- eraseText: 128
- inputText: NativeAcceptanceOnly!2026
# Do not press Enter in the password field: iOS may submit the form and
# clear the secure input before the explicit auth-submit tap. The only
# credential submission in this flow is the button below.
# The iOS keyboard can cover the button while Maestro still reports it as
# visible in the accessibility tree. Dismiss the keyboard before the only
# password-based sign-in action, without retrying or replaying credentials.
# Once the API confirms a session, a fresh encrypted SQLCipher farm vault can
# take longer than 45 seconds to initialize on a cold simulator. Wait for the
# actual sign-in control to disappear; never re-submit the credentials.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          label: Dismiss the visible iOS keyboard through the application's own control
          when:
            visible:
              id: keyboard-dismiss
          commands:
            - tapOn:
                id: keyboard-dismiss
# A simulator keyboard dismissal can expose the underlying sign-in mode
# selector. Close only the visibly observed selector before submit.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          label: Dismiss an observed iOS sign-in mode selector
          when:
            visible:
              id: sheet-close
          commands:
            - assertVisible:
                id: sheet-close
            - tapOn:
                id: sheet-close
            - assertNotVisible:
                id: sheet-close
- scrollUntilVisible:
    element:
      id: auth-submit
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-submit
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible:
            id: auth-submit
          timeout: 120000
      - runFlow: dismiss-password-save.yaml
