appId: eu.onesa.smartfarmer
---
- scrollUntilVisible:
    element:
      id: auth-username
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-username
- runFlow:
    label: Dismiss only the observed iOS first-use keyboard tutorial
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Continue$'
          below: '^Speed up your typing by sliding your finger across the letters to compose a word\.$'
          optional: true
      - assertNotVisible:
          id: UIContinuousPathIntroductionView
- eraseText: 80
- inputText: native_owner
- pressKey: Enter
- assertVisible:
    id: auth-username
    text: '^native_owner$'
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-password
- eraseText: 128
- inputText: NativeAcceptanceOnly!2026
# Do not press Enter in the password field: iOS may submit the form and
# clear the secure input before the explicit auth-submit tap. The only
# credential submission in this flow is the button below.
# The iOS keyboard can cover the button while Maestro still reports it as
# visible in the accessibility tree. Dismiss the keyboard before the only
# password-based sign-in action, without retrying or replaying credentials.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
# On a freshly booted iOS simulator, the keyboard-dismiss touch can land on
# the sign-in mode Choice behind the keyboard and expose its option sheet.
# Recover only that visibly identified sheet; never submit credentials twice.
- runFlow:
    label: Dismiss observed sign-in mode selector after iOS keyboard closes
    when:
      visible:
        text: '^Sarudza
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-submit
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible:
            id: auth-submit
          timeout: 45000
      - runFlow: dismiss-password-save.yaml

    commands:
      - assertVisible:
          text: '^Pinda
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-submit
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible:
            id: auth-submit
          timeout: 45000
      - runFlow: dismiss-password-save.yaml

      - tapOn:
          text: '^Vhara
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-submit
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible:
            id: auth-submit
          timeout: 45000
      - runFlow: dismiss-password-save.yaml

      - assertNotVisible:
          text: '^Sarudza
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-submit
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible:
            id: auth-submit
          timeout: 45000
      - runFlow: dismiss-password-save.yaml

- scrollUntilVisible:
    element:
      id: auth-submit
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-submit
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible:
            id: auth-submit
          timeout: 45000
      - runFlow: dismiss-password-save.yaml
