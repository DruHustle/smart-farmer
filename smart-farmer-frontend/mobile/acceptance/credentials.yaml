appId: eu.onesa.smartfarmer
---
- scrollUntilVisible:
    element:
      id: auth-username
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-username
- runFlow:
    label: Dismiss only the observed iOS first-use keyboard tutorial
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Continue$'
          below: '^Speed up your typing by sliding your finger across the letters to compose a word\.$'
          optional: true
      - assertNotVisible:
          id: UIContinuousPathIntroductionView
- eraseText: 80
- inputText: native_owner
- pressKey: Enter
- assertVisible:
    id: auth-username
    text: '^native_owner$'
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-password
- eraseText: 128
- inputText: NativeAcceptanceOnly!2026
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: auth-submit
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-submit
