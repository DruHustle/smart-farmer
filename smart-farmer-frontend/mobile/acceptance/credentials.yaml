appId: eu.onesa.smartfarmer
---
- scrollUntilVisible:
    element:
      id: auth-username
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-username
- runFlow:
    label: Dismiss only the observed iOS first-use keyboard tutorial
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Continue$'
          below: '^Speed up your typing by sliding your finger across the letters to compose a word\.$'
          optional: true
      - assertNotVisible:
          id: UIContinuousPathIntroductionView
- eraseText: 80
- inputText: native_owner
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          label: Recover incomplete username input before entering the password
          when:
            notVisible:
              id: auth-username
              text: '^native_owner$'
          commands:
            - tapOn:
                id: auth-username
            - eraseText: 80
            - inputText: native
            - extendedWaitUntil:
                visible:
                  id: auth-username
                  text: '^native$'
                timeout: 12000
            - inputText: _owner
      - extendedWaitUntil:
          visible:
            id: auth-username
            text: '^native_owner$'
          timeout: 12000
- pressKey: Enter
- assertVisible:
    id: auth-username
    text: '^native_owner$'
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-password
- eraseText: 128
- inputText: NativeAcceptanceOnly!2026
# Do not press Enter in the password field: iOS may submit the form and
# clear the secure input before the explicit auth-submit tap. The only
# credential submission in this flow is the button below.
# The iOS keyboard can cover the button while Maestro still reports it as
# visible in the accessibility tree. Dismiss the keyboard before the only
# password-based sign-in action, without retrying or replaying credentials.
# Once the API confirms a session, a fresh encrypted SQLCipher farm vault can
# take longer than 45 seconds to initialize on a cold simulator. Wait for the
# actual sign-in control to disappear; never re-submit the credentials.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          label: Dismiss the visible iOS keyboard through the application's own control
          when:
            visible:
              id: keyboard-dismiss
          commands:
            - tapOn:
                id: keyboard-dismiss
            - assertNotVisible:
                id: keyboard-dismiss
# A simulator keyboard dismissal can expose the underlying sign-in mode
# selector. Close only the visibly observed selector before submit.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          label: Dismiss an observed iOS sign-in mode selector
          when:
            visible:
              id: sheet-close
          commands:
            - assertVisible:
                id: sheet-close
            - tapOn:
                id: sheet-close
            - assertNotVisible:
                id: sheet-close
- scrollUntilVisible:
    element:
      id: auth-submit
    direction: DOWN
    timeout: 20000
- tapOn:
    id: auth-submit
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible:
            id: auth-submit
          timeout: 120000
      - runFlow: dismiss-password-save.yaml
