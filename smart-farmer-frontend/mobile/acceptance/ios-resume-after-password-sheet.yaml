appId: eu.onesa.smartfarmer
---
- tapOn:
    point: '${NOT_NOW_POINT}'
# A classified coordinate tap can complete while Apple's sheet still covers Farmer.
# Dismiss the live system control before waiting for the covered workspace.
- runFlow: dismiss-password-save.yaml
- extendedWaitUntil:
    notVisible:
      text: '^Not Now$'
      below: '^Securely store your password so it’s filled automatically the next time you need it\.$'
    timeout: 10000
- runFlow: record-after-login.yaml
