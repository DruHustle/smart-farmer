appId: eu.onesa.smartfarmer
---
# The recorded iOS keyboard covers the lower 40% of the screen. Drag the
# unobscured ScrollView area; on-drag dismissal preserves multiline Return.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 20%
          duration: 400
      - assertNotVisible:
          id: '^inputView$'
# The Android moderation sheet starts below that swipe. hideKeyboard sends
# Back, so require the recorded Gboard window before invoking it.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible:
              id: '^com[.]google[.]android[.]inputmethod[.]latin:id/.*$'
          commands:
            - hideKeyboard
      - assertNotVisible:
          id: '^com[.]google[.]android[.]inputmethod[.]latin:id/.*$'
