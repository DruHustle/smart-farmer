appId: eu.onesa.smartfarmer
---
# Exercise the same explicit action available to keyboard and touch users.
# It blurs the input without submitting, discarding the draft or adding Return.
- tapOn:
    id: keyboard-dismiss
- assertNotVisible:
    id: keyboard-dismiss
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 20%
          duration: 400
      - assertNotVisible:
          id: '^inputView$'
# The Android moderation sheet starts below that swipe. hideKeyboard sends
# Back, so require the recorded Gboard window before invoking it.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible:
              id: '^com[.]google[.]android[.]inputmethod[.]latin:id/.*$'
          commands:
            - hideKeyboard
      - assertNotVisible:
          id: '^com[.]google[.]android[.]inputmethod[.]latin:id/.*$'
